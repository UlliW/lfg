<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KlimaCampus · LFG Entdeckerschule</title><style>
:root{color-scheme:dark;--bg:#101d28;--panel:#192b38;--line:#38515e;--ink:#edf7f5;--muted:#b4c9ce;--green:#91e5b5;--blue:#9edaff;--gold:#ffd38b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#254b4e,transparent 55%),var(--bg);font:16px/1.55 system-ui,sans-serif;color:var(--ink)}button,input,select{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer;color:inherit;background:#243f4d;border:1px solid #54717c;border-radius:12px;padding:12px 16px;min-height:46px;text-align:left}button:hover{background:#325463}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button.primary{background:var(--green);color:#102b23;border-color:var(--green);font-weight:800}button:disabled{cursor:default;opacity:.65}a{color:var(--blue)}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.05;letter-spacing:-.05em}h2{font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.15}h3{font-size:1.1rem}header,main,footer{max-width:1180px;margin:auto;padding:20px clamp(14px,4vw,36px)}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.eyebrow{font-size:.76rem;text-transform:uppercase;letter-spacing:.14em;color:var(--green);font-weight:800}.muted{color:var(--muted)}nav,.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}nav button[aria-current=true]{background:#d8ede7;color:#15352d;font-weight:800}.hero{padding:clamp(20px,4vw,36px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(125deg,#193b3d,#22334d);margin-bottom:24px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}.tile{min-height:145px;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);padding:17px}.tile strong{font-size:1.18rem}.tile .symbol{font-size:1.9rem;color:var(--green)}.tile small{color:var(--muted)}.section{margin:26px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(15px,3vw,24px);margin:15px 0}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#13242b;border:1px solid var(--line);padding:12px 16px;border-radius:14px;flex:1;min-width:115px}.stat b{font-size:1.5rem;display:block;color:var(--green)}.meter{height:10px;background:#0d1921;border-radius:10px;overflow:hidden;margin:10px 0}.meter i{display:block;background:var(--green);height:100%}details{background:#203d4b;border:2px solid #78bdb5;border-radius:14px;margin:12px 0;overflow:hidden}summary{cursor:pointer;padding:16px;font-weight:850;font-size:1.12rem;color:#c6ffe6;min-height:54px}details>div{padding:0 15px 15px}.fact{background:#142833;border-radius:10px;padding:13px;margin:8px 0}.fact b{display:block;color:var(--blue)}.choices{display:grid;gap:10px;margin:16px 0}.choices button{width:100%}.right{border-color:#91e5b5!important;background:#244b3b!important}.wrong{border-color:#ffaaaa!important;background:#56323e!important}.feedback{padding:14px;border-radius:12px;background:#263e4b;margin:12px 0}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.lane{background:#11232d;border-radius:12px;padding:10px;min-height:150px}.ticket{background:#304d5a;padding:10px;border-radius:10px;margin:8px 0;overflow-wrap:anywhere}.ticket button{padding:6px 10px;min-height:44px}input,select{border:1px solid #78949e;background:#10232d;color:var(--ink);border-radius:10px;padding:10px;min-height:44px;max-width:100%}.network{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.network button{text-align:center;border-color:#76a9b4;background:#284754}.network .core{grid-column:1/-1;background:#32705d}.diagram{width:100%;height:auto;max-height:300px}.material{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:13px 0}.material a{display:inline-block;padding:8px}.tag{color:var(--gold);font-size:.85rem;font-weight:700}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}footer{border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap}#status{min-height:1.7em}.poster{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mock{background:#eaf3ed;color:#183a36;padding:16px;border-radius:12px;min-height:180px}.mock.bad{font-size:11px;line-height:1.2}.mock.good h3{font-size:1.6rem}.mock.good .stripe{height:24px;background:#278566;border-radius:4px;margin:10px 0}.seq{display:grid;gap:8px}.seq button{width:100%}@media(max-width:680px){.hero{grid-template-columns:1fr}.board{grid-template-columns:1fr 1fr}.poster{grid-template-columns:1fr}header{padding-bottom:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}} </style></head><body><header><div><div class="eyebrow">LFG Tools / Entdeckerschule / Klasse 9</div><h1>KlimaCampus</h1></div><div><strong id="points">0 XP</strong><div class="muted" id="rank">Entdecker:in</div></div><nav aria-label="Hauptnavigation"><button data-nav="home">Campus</button><button data-nav="work">Werkstatt</button><button data-nav="lib">Materialien</button></nav></header><main id="main" tabindex="-1"></main><footer><a href="../../index.html">Zurück zu LFG-Tools</a><a href="https://lfg-ma.de/impressum-b/">Impressum</a><a href="https://lfg-ma.de/datenschutz/">Datenschutz</a><span class="muted">Fortschritt nur in dieser Sitzung.</span></footer><div id="live" class="sr" aria-live="polite"></div><script>
const modules=[{"id": "klima", "group": "Wissen", "title": "Treibhauseffekt", "icon": "☀", "lead": "Warum erwärmt sich die Erde?", "cards": [["Natürlich", "Treibhausgase absorbieren einen Teil der langwelligen Wärmestrahlung und emittieren sie in alle Richtungen. Der natürliche Effekt ermöglicht lebensfreundliche Temperaturen."], ["Verstärkt", "Kohle, Erdöl und Erdgas setzen bei Verbrennung CO₂ frei. Viehhaltung, Reisanbau und fossile Förderung können Methan freisetzen."], ["Energiebilanz", "Mehr Treibhausgase verändern die Abstrahlung ins All. Die Erde erwärmt sich, bis sich eine neue Energiebilanz einstellt."], ["Wetter und Klima", "Wetter beschreibt den momentanen Zustand; Klima die statistischen Eigenschaften über lange Zeiträume."]], "qs": [["Welche Strahlung absorbieren Treibhausgase besonders?", "Langwellige Wärmestrahlung", "Nur sichtbares Licht", "Schallwellen", "Die Erdoberfläche strahlt infrarote Wärme ab."], ["Warum ist der natürliche Treibhauseffekt wichtig?", "Er ermöglicht lebensfreundliche Temperaturen", "Er verhindert jede Wetteränderung", "Er erzeugt Sonnenlicht", "Ohne ihn wäre die Erde wesentlich kälter."], ["Welche Tätigkeit setzt direkt CO₂ aus fossilen Quellen frei?", "Kohle verbrennen", "Windrad drehen lassen", "Sonnenlicht sammeln", "Fossiler Kohlenstoff wird bei Verbrennung zu CO₂."], ["Wo entsteht unter anderem Methan?", "Bei der Verdauung von Rindern", "In Solarzellen", "Beim Gefrieren von Wasser", "Mikroorganismen bilden Methan."], ["Ein kalter Wintertag widerlegt die Erderwärmung?", "Nein, ein Tag sagt wenig über den Klimatrend aus", "Ja, Temperatur darf niemals fallen", "Ja, Schnee ist weltweit verschwunden", "Wetter und Klima sind unterschiedliche Maßstäbe."], ["Was passiert zunächst bei mehr Treibhausgasen?", "Die Energiebilanz verschiebt sich", "Die Sonne wird heller", "Die Erdrotation stoppt", "Weniger Wärme entweicht zunächst ins All."]], "files": ["klima.pdf", "factsheet.pdf", "quiz.pdf", "folien.pptx"], "seq": ["Fossile Energieträger verbrennen", "CO₂-Konzentration steigt", "Energiebilanz verändert sich", "Erde erwärmt sich"]}, {"id": "folgen", "group": "Wissen", "title": "Folgen & Kipppunkte", "icon": "🌊", "lead": "Verfolge Wirkungsketten statt isolierter Fakten.", "cards": [["Ozeane", "Sie nehmen einen großen Teil der zusätzlichen Wärme auf. Gelöstes CO₂ verändert die Wasserchemie; der pH-Wert sinkt."], ["Extreme", "Hitze und viele Starkniederschläge werden wahrscheinlicher oder intensiver. Nicht jedes einzelne Extremereignis ist allein durch Klimawandel erklärbar."], ["Kipppunkte", "Kritische Schwellen können weitreichende, sich selbst verstärkende und langfristig schwer umkehrbare Veränderungen auslösen."], ["Gesellschaft", "Ernteausfälle können Armut und Hunger verstärken. Migration hängt zusätzlich von vielen sozialen und politischen Faktoren ab."]], "qs": [["Warum sinkt der pH-Wert im Meer durch CO₂?", "Gelöstes CO₂ verändert die Wasserchemie", "CO₂ wird zu Salz", "Wasser verliert sämtlichen Sauerstoff", "Unter anderem bildet sich Kohlensäure."], ["Welche Rückkopplung verstärkt Erwärmung?", "Eis schmilzt, dunklere Flächen absorbieren mehr Sonnenenergie", "Eis schmilzt, Reflexion steigt", "Wärme lässt Sonnenlicht verschwinden", "Das Eis-Albedo-Feedback verstärkt den ursprünglichen Effekt."], ["Was bezeichnet ein Kipppunkt?", "Eine kritische Schwelle im System", "Jeden heißen Tag", "Ein politisches Klimaziel", "Nach Überschreiten können grundlegende Systemänderungen folgen."], ["Welche Aussage zu Migration ist sinnvoll?", "Klimafolgen können zusammen mit anderen Faktoren Migration beeinflussen", "Klima erklärt jede Migration allein", "Migration hat nie Umweltursachen", "Gesellschaftliche Wirkungen sind komplex."], ["Warum sind Korallen gefährdet?", "Erwärmung und Versauerung belasten sie", "Mehr Salz entsteht aus CO₂", "Sie benötigen ausschließlich kaltes Süßwasser", "Beide Veränderungen können Riffe schädigen."], ["Was ist Anpassung?", "Hitzeschutzpläne entwickeln", "Kohle statt Wind nutzen", "Messdaten löschen", "Anpassung verringert Schäden durch Klimafolgen."]], "files": ["klima.pdf", "factsheet.pdf"], "seq": ["Hitze und Trockenheit nehmen zu", "Ernten können ausfallen", "Lebensmittel können teurer werden", "Ernährungssicherheit kann sinken"]}, {"id": "bio", "group": "Wissen", "title": "Biodiversität", "icon": "🌿", "lead": "Vielfalt auf drei Ebenen verstehen.", "cards": [["Drei Ebenen", "Genetische Vielfalt, Artenvielfalt und Vielfalt der Ökosysteme bilden Biodiversität."], ["Ökosysteme", "Lebewesen und unbelebte Umwelt wirken zusammen. Bestäubung, Bodenbildung und Wasserhaushalt sind wichtige Leistungen."], ["Bedrohungen", "Lebensraumverlust, Übernutzung, Verschmutzung, invasive Arten und Klimawandel können Vielfalt vermindern."], ["Handeln", "Lebensräume schützen, vernetzen und wiederherstellen; standortgerechte Pflanzen fördern."]], "qs": [["Was gehört zur Biodiversität?", "Gene, Arten und Ökosysteme", "Nur die Anzahl der Bäume", "Nur große Säugetiere", "Vielfalt existiert auf mehreren Ebenen."], ["Warum helfen vernetzte Lebensräume?", "Arten können wandern und Populationen sich austauschen", "Alle Arten leben dann am selben Ort", "Sie verhindern jede Dürre", "Verbindungen mindern Isolation."], ["Welche Maßnahme hilft Bestäubern besonders?", "Vielfältige heimische Blühpflanzen", "Alle Flächen versiegeln", "Blüten vor dem Öffnen mähen", "Nahrung und Lebensräume werden bereitgestellt."], ["Warum kann genetische Vielfalt nützlich sein?", "Populationen können unterschiedlich auf Veränderungen reagieren", "Alle Individuen werden identisch", "Sie verhindert jede Krankheit", "Unterschiede können Anpassung begünstigen."], ["Welche Untersuchung vergleicht zwei Schulhofflächen fair?", "Gleiche Beobachtungszeit und Flächengröße", "Eine Fläche länger beobachten", "Nur besonders schöne Arten zählen", "Vergleichbare Bedingungen sind wichtig."], ["Was ist ein Zielkonflikt?", "Windenergie ausbauen und sensible Lebensräume schützen", "Arten zählen und protokollieren", "Pflanzen benennen und fotografieren", "Mehrere legitime Ziele müssen abgewogen werden."]], "files": ["factsheet.pdf", "sdg.pdf"], "seq": null}, {"id": "wende", "group": "Wissen", "title": "Klimawende & Energie", "icon": "⚡", "lead": "Vom fossilen zum postfossilen Zeitalter.", "cards": [["Energieträger", "Kohle, Öl und Gas sind fossil. Wind, Sonne, Wasser, Erdwärme und Biomasse sind erneuerbar. Kernenergie ist nicht fossil, aber nicht erneuerbar."], ["Sektoren", "Strom, Wärme und Verkehr müssen gemeinsam betrachtet werden. Elektrifizierung, Effizienz und erneuerbare Energie sind wichtige Bausteine."], ["Klimaschutz", "Emissionen vermeiden und natürliche Kohlenstoffsenken erhalten. Anpassung ergänzt Klimaschutz."], ["IPCC", "Der Weltklimarat bewertet den Forschungsstand und liefert Grundlagen für politische Entscheidungen; er erlässt keine Gesetze."]], "qs": [["Was ist weder fossil noch erneuerbar?", "Kernenergie", "Kohle", "Windenergie", "Uran ist eine begrenzte Ressource."], ["Was ist Aufgabe des IPCC?", "Forschungsstand bewerten", "Klimagesetze beschließen", "Kraftwerke bauen", "Der IPCC liefert wissenschaftliche Grundlagen."], ["Warum reicht erneuerbarer Strom allein nicht?", "Wärme und Verkehr benötigen ebenfalls Lösungen", "Strom hat keinen Einfluss auf Emissionen", "Alle Fahrzeuge fahren bereits elektrisch", "Die Transformation umfasst mehrere Sektoren."], ["Welche Maßnahme schützt eine Kohlenstoffsenke?", "Intakte Moore erhalten", "Moore entwässern", "Wald dauerhaft versiegeln", "Moore können Kohlenstoff speichern."], ["Was bedeutet Effizienz?", "Gleiche Leistung mit weniger Energieaufwand", "Mehr Energie für gleiche Leistung", "Jede Technik abschalten", "Effizienz senkt den Bedarf."], ["Welche Aussage ist differenziert?", "Auch erneuerbare Anlagen brauchen Material und Fläche", "Erneuerbare Anlagen haben keinerlei Umweltwirkung", "Jeder Energieträger ist gleich klimaschädlich", "Lebenszyklus und Zielkonflikte zählen."]], "files": ["klima.pdf", "factsheet.pdf"], "seq": null}, {"id": "sdg", "group": "Wissen", "title": "17 Nachhaltigkeitsziele", "icon": "🌍", "lead": "Eine gemeinsame Vision mit Zielkonflikten.", "cards": [["Agenda 2030", "2015 beschlossen die UN-Mitgliedstaaten 17 Ziele für nachhaltige Entwicklung. Sie gelten für alle Länder."], ["Drei Dimensionen", "Ökologie: Lebensgrundlagen erhalten. Soziales: gerechte Lebensbedingungen. Ökonomie: langfristig tragfähiger Wohlstand."], ["Synergien", "Klimaschutz kann Gesundheit und Artenvielfalt fördern. Zielkonflikte entstehen beispielsweise durch Flächen- oder Ressourcenbedarf."], ["Verbindlichkeit", "Die SDGs sind gemeinsame politische Ziele, kein Vertrag, der ihre vollständige Erfüllung erzwingt."]], "qs": [["Wann wurden die SDGs beschlossen?", "2015", "1990", "2030", "Die Agenda 2030 wurde 2015 beschlossen."], ["Für wen gelten die Ziele?", "Alle Länder", "Nur arme Länder", "Nur EU-Staaten", "Sie sind universell."], ["Welches SDG betrifft Klimaschutz?", "13", "4", "16", "SDG 13 heißt Maßnahmen zum Klimaschutz."], ["Was ist eine Synergie?", "Ein Schulgarten fördert Biodiversität und Bildung", "Eine Maßnahme verhindert ein anderes Ziel", "Zwei Ziele haben gleiche Nummern", "Eine Handlung kann mehrere Ziele fördern."], ["Welche drei Dimensionen gehören zusammen?", "Ökologisch, sozial, ökonomisch", "Digital, analog, elektrisch", "Lokal, klein, schnell", "Nachhaltigkeit verbindet diese drei Dimensionen."], ["Sind die SDGs ein weltweit durchsetzbarer Vertrag?", "Nein, gemeinsame politische Ziele", "Ja, jedes Ziel ist einklagbar", "Nein, nur private Vorschläge", "Sie geben eine gemeinsame politische Orientierung."]], "files": ["sdg.pdf"], "seq": null}, {"id": "bias", "group": "Denken", "title": "Denkfehler erkennen", "icon": "🧠", "lead": "Prüfe zuerst dein eigenes Denken.", "cards": [["Salience Bias", "Ein spektakuläres Video wirkt wichtiger als unauffällige Statistiken."], ["Anchoring Bias", "Eine erste Zahl beeinflusst spätere Schätzungen."], ["Framing Effect", "Die Formulierung verändert die Wirkung gleicher Fakten."], ["Conformity Bias", "Die Meinung der Gruppe beeinflusst das eigene Urteil."], ["Overconfidence Bias", "Die eigene Sicherheit übersteigt die Belege."], ["WYSIATI", "Aus verfügbaren Informationen wird vorschnell eine ganze Geschichte."], ["Confirmation Bias", "Passende Belege werden bevorzugt."], ["Thomas-Theorem", "Eine Deutung kann durch Verhalten reale Folgen erzeugen."], ["Normalcy Bias", "Man erwartet trotz Warnzeichen, dass alles bleibt wie bisher."], ["Psychologische Distanz", "Ferne Probleme wirken weniger unmittelbar."]], "qs": [["Ein virales Hochwasservideo lässt dich alle anderen Risiken vergessen. Welches Konzept passt am besten?", "Salience Bias", "Framing Effect", "WYSIATI", "Ein spektakuläres Video wirkt wichtiger als unauffällige Statistiken."], ["Eine zufällig genannte hohe Kostenzahl prägt deine spätere Kostenschätzung. Welches Konzept passt am besten?", "Anchoring Bias", "Conformity Bias", "Confirmation Bias", "Eine erste Zahl beeinflusst spätere Schätzungen."], ["90 % Erfolg klingt anders als 10 % Misserfolg. Welches Konzept passt am besten?", "Framing Effect", "Overconfidence Bias", "Thomas-Theorem", "Die Formulierung verändert die Wirkung gleicher Fakten."], ["Du änderst deine Antwort nur, weil alle anderen anders stimmen. Welches Konzept passt am besten?", "Conformity Bias", "WYSIATI", "Normalcy Bias", "Die Meinung der Gruppe beeinflusst das eigene Urteil."], ["Nach einem kurzen Video bist du sicher, alle Klimafragen beantworten zu können. Welches Konzept passt am besten?", "Overconfidence Bias", "Confirmation Bias", "Psychologische Distanz", "Die eigene Sicherheit übersteigt die Belege."], ["Aus einem Foto leitest du den Zustand eines ganzen Waldes ab, ohne weitere Daten zu suchen. Welches Konzept passt am besten?", "WYSIATI", "Thomas-Theorem", "Salience Bias", "Aus verfügbaren Informationen wird vorschnell eine ganze Geschichte."], ["Du sammelst nur Studien, die deine bereits feststehende Meinung stützen. Welches Konzept passt am besten?", "Confirmation Bias", "Normalcy Bias", "Anchoring Bias", "Passende Belege werden bevorzugt."], ["Alle glauben, ein Projekt werde scheitern, arbeiten nicht mehr mit und es scheitert tatsächlich. Welches Konzept passt am besten?", "Thomas-Theorem", "Psychologische Distanz", "Framing Effect", "Eine Deutung kann durch Verhalten reale Folgen erzeugen."], ["Trotz Hitzewarnung gehst du davon aus, dass es wie immer gutgehen wird. Welches Konzept passt am besten?", "Normalcy Bias", "Salience Bias", "Conformity Bias", "Man erwartet trotz Warnzeichen, dass alles bleibt wie bisher."], ["Du findest Folgen in hundert Jahren weniger wichtig als dieselben Folgen morgen. Welches Konzept passt am besten?", "Psychologische Distanz", "Anchoring Bias", "Overconfidence Bias", "Ferne Probleme wirken weniger unmittelbar."]], "files": ["denken.pdf", "tafel.png"], "seq": null}, {"id": "werk", "group": "Denken", "title": "Fünf Denkwerkzeuge", "icon": "🔎", "lead": "Fachwissen sinnvoll nutzen.", "cards": [["Neugier", "Welche Informationen fehlen noch?"], ["Zweifel", "Woher wissen wir das? Wie belastbar ist die Evidenz?"], ["Perspektivwechsel", "Wie sieht eine Situation aus Sicht anderer Beteiligter aus? Nicht jede Behauptung ist deshalb gleich richtig."], ["Fantasie", "Was könnte anders sein, als es heute ist?"], ["Herauszoomen", "Was wird bei einem anderen Zeit- oder Raummaßstab sichtbar?"]], "qs": [["Eine einzelne kalte Woche wird als Trend gedeutet. Was hilft besonders?", "Herauszoomen", "Konformität", "Ankereffekt", "Ein langer Zeitraum zeigt den Klimatrend."], ["Du prüfst die Messmethode einer Studie. Welches Werkzeug?", "Zweifel", "Fantasie", "Normalcy Bias", "Evidenz kritisch prüfen."], ["Du fragst, was du noch nicht weißt. Welches Werkzeug?", "Neugier", "Framing", "Konformität", "Fragen öffnen die Untersuchung."], ["Du entwirfst eine autofreie Straße für 2040. Welches Werkzeug?", "Fantasie", "Ankereffekt", "Pseudo-Experten", "Neue Möglichkeiten gedanklich erproben."], ["Du betrachtest einen Windpark aus Sicht von Anwohnenden und Naturschutz. Was nutzt du?", "Perspektivwechsel", "Rosinen-Pickerei", "Selbstüberschätzung", "Perspektiven helfen bei der Abwägung."], ["Was folgt aus Perspektivwechsel nicht?", "Dass alle Tatsachenbehauptungen gleich richtig sind", "Dass Interessen sichtbar werden", "Dass andere Erfahrungen wichtig sein können", "Evidenz bleibt entscheidend."]], "files": ["denken.pdf", "tafel.png"], "seq": null}, {"id": "plurv", "group": "Denken", "title": "Desinformation & PLURV", "icon": "🛡", "lead": "Argumente statt Personen prüfen.", "cards": [["P – Pseudo-Experten", "Fachfremde Autorität wird als Beleg eingesetzt."], ["L – Logikfehler", "Eine Schlussfolgerung folgt nicht aus den Gründen; etwa ein persönlicher Angriff statt Sachargument."], ["U – Unerfüllbare Erwartungen", "Es wird beispielsweise eine völlig folgenlose Technologie verlangt."], ["R – Rosinen-Pickerei", "Passende Daten werden isoliert und andere relevante Daten ausgeblendet."], ["V – Verschwörungstheorien", "Unbelegte geheime Absprachen sollen Befunde erklären."], ["Faktencheck", "Originalquelle, Datum, Kontext und unabhängige Belege prüfen. Ein Irrtum allein beweist keine absichtliche Täuschung."]], "qs": [["Ein fachfremder Promi soll Klimaforschung widerlegen. Welche Technik?", "Pseudo-Experten", "Rosinen-Pickerei", "Unerfüllbare Erwartungen", "Bekanntheit ersetzt keine Fachkompetenz."], ["Du hast ein Auto, daher ist dein Klimaschutzargument falsch. Welche Technik?", "Logikfehler", "Pseudo-Experten", "Rosinen-Pickerei", "Ein persönlicher Angriff widerlegt kein Argument."], ["Nur eine Technologie ohne irgendeinen Ressourcenverbrauch sei akzeptabel. Was passt?", "Unerfüllbare Erwartungen", "Logikfehler durch Personenangriff", "Pseudo-Experten", "Ein unrealistischer Maßstab verhindert Abwägung."], ["Ein kurzer Ausschnitt einer langen Temperaturreihe wird gezielt ausgewählt. Was passt?", "Rosinen-Pickerei", "Pseudo-Experten", "Verschwörungstheorie", "Der relevante Gesamtkontext fehlt."], ["Ohne Belege wird behauptet, alle Klimaforschenden hätten sich heimlich abgesprochen. Was passt?", "Verschwörungstheorie", "Unerfüllbare Erwartungen", "Anpassung", "Die Behauptung benötigt belastbare Belege."], ["Was prüfst du vor dem Teilen eines Memes?", "Originalquelle, Datum und unabhängige Belege", "Nur die Zahl der Likes", "Nur ob es meine Meinung bestätigt", "Reichweite ist kein Wahrheitskriterium."]], "files": ["klima.pdf", "tafel.png"], "seq": null}, {"id": "talk", "group": "Denken", "title": "Klimakommunikation", "icon": "💬", "lead": "Verbindung schaffen, dann sachlich klären.", "cards": [["Fühlen", "Sorgen ernst nehmen, ohne falsche Behauptungen zu bestätigen."], ["Fragen", "Nach persönlichen Erfahrungen und konkreten Befürchtungen fragen."], ["Fakten", "Relevante Informationen nachvollziehbar und mit Quellen klären."], ["Framing", "Einen konstruktiven Gesprächsrahmen schaffen und mögliche Lösungen besprechen."]], "qs": [["Jemand fürchtet hohe Heizkosten. Was ist ein guter Einstieg?", "Die Sorge anerkennen", "Die Person lächerlich machen", "Sofort zwanzig Statistiken nennen", "Empathie kann Gesprächsbereitschaft schaffen."], ["Welche Frage hilft beim Verstehen?", "Welche Kosten machen dir konkret Sorgen?", "Warum bist du so ignorant?", "Willst du nicht einfach zustimmen?", "Offene Fragen machen Bedürfnisse sichtbar."], ["Wie gehst du mit einer falschen Zahl um?", "Sachlich prüfen und Quelle erläutern", "Die Zahl einfach akzeptieren", "Die Person angreifen", "Respekt und Fakten gehören zusammen."], ["Welcher Rahmen ist konstruktiv?", "Wie können wir bezahlbar und klimafreundlich heizen?", "Wer ist an allem schuld?", "Es gibt sowieso keine Lösung", "Ein gemeinsames Ziel fördert Austausch."], ["Was heißt Empathie nicht?", "Jede Behauptung für wahr erklären", "Zuhören", "Sorgen ernst nehmen", "Verständnis für Gefühle ist keine Zustimmung zu Faktenbehauptungen."]], "files": ["klima.pdf"], "seq": ["Fühlen", "Fragen", "Fakten", "Framing"]}, {"id": "kanban", "group": "Methoden", "title": "Projektboard · Kanban", "icon": "▦", "lead": "Arbeit sichtbar machen und Engpässe erkennen.", "cards": [["Aufgaben", "Jede Karte beschreibt ein konkretes Ergebnis, eine verantwortliche Person und möglichst ein Prüfkriterium."], ["Spalten", "Offen → In Arbeit → Prüfen → Fertig. Karten wechseln erst, wenn der jeweilige Schritt erfüllt ist."], ["WIP", "Begrenzt gleichzeitig angefangene Aufgaben. Helft zuerst, laufende Arbeiten abzuschließen."], ["Blockaden", "Markiert Hindernisse und vereinbart, wer sie beseitigt."]], "qs": [["Welche Karte ist brauchbar?", "Drei geeignete Quellen zum Meeresspiegel prüfen, Lea, bis Mittwoch", "Irgendwas recherchieren", "Alle machen alles", "Ein konkretes Ergebnis erleichtert Koordination."], ["Eine Karte wartet auf einen Quellencheck. Wohin gehört sie?", "Prüfen", "Fertig", "Offen ohne Hinweis", "Fertig setzt die vereinbarten Kriterien voraus."], ["In Arbeit ist voll. Was hilft?", "Eine laufende Aufgabe gemeinsam abschließen", "Weitere fünf Aufgaben anfangen", "Das Board löschen", "Weniger parallele Arbeit verbessert den Fluss."], ["Ein Interviewtermin fehlt. Was tun?", "Karte als blockiert markieren und Klärung organisieren", "So tun als sei alles fertig", "Alle Karten verschieben", "Hindernisse sichtbar machen."], ["Wann ist eine Karte fertig?", "Wenn das vereinbarte Ergebnis geprüft ist", "Wenn jemand angefangen hat", "Wenn die Stunde endet", "Fertig bedeutet nachweisbares Ergebnis."]], "files": [], "seq": ["Offen", "In Arbeit", "Prüfen", "Fertig"]}, {"id": "scrum", "group": "Methoden", "title": "Scrum-Denken", "icon": "↻", "lead": "In kurzen Zyklen ein Produkt verbessern.", "cards": [["Produktziel", "Ein gemeinsames Ziel beschreibt den Nutzen für die Zielgruppe."], ["Sprint", "Ein kurzer Arbeitszyklus mit einem klaren Sprintziel und ausgewählten Aufgaben."], ["Review", "Ein konkretes Zwischenergebnis zeigen, Feedback sammeln und l einen konkreten Zweck erfüllen."], ["Was ist ein Prototyp?", "Eine frühe testbare Version", "Immer das fertige Produkt", "Eine reine Themenliste", "Man kann früh Annahmen prüfen."], ["Welche Rückmeldung hilft am meisten?", "Ich habe Regel 3 nicht verstanden, weil ein Beispiel fehlt", "Alles super", "Das ist irgendwie schlecht", "Konkrete Beobachtungen sind umsetzbar."], ["Welche Erfolgskriterien passen zu einem Lernspiel?", "Fakten stimmen, Regeln sind verständlich, Lernziel wird erreicht", "Es hat möglichst viele Farben", "Es ist möglichst teuer", "Kriterien beschreiben die angestrebte Wirkung."], ["Was tun, wenn ein Produkt zu umfangreich wird?", "Kernfunktion priorisieren und Extras zurückstellen", "Alle Ideen gleichzeitig umsetzen", "Auf Kriterien verzichten", "Ein kleiner funktionierender Kern ist wertvoll."]], "files": [], "seq": ["Problem und Zielgruppe klären", "Kriterien festlegen", "Prototyp bauen", "Testen und verbessern"]}, {"id": "kreativ", "group": "Methoden", "title": "Kreativität systematisch", "icon": "✦", "lead": "Viele Ideen erzeugen, dann bewusst auswählen.", "cards": [["Öffnen", "Beim Brainwriting zunächst einzeln Ideen sammeln, ohne sofort zu bewerten."], ["Variieren", "Kombinieren, umkehren, vereinfachen oder aus einer anderen Perspektive denken."], ["Auswählen", "Ideen anhand von Wirkung, Machbarkeit und fachlichem Nutzen vergleichen."], ["Ausprobieren", "Eine Idee als kleine Skizze oder Probe umsetzen; bei Bedarf zurück zur Ideensammlung."]], "qs": [["Warum zunächst stilles Brainwriting?", "Alle können unabhängig Ideen beitragen", "Nur laute Personen sollen entscheiden", "Die erste Idee gewinnt immer", "Unabhängige Beiträge erweitern den Ideenraum."], ["Was ist eine kreative Variation?", "Ein Faktenquiz mit einer Detektivgeschichte verbinden", "Eine Idee wortgleich wiederholen", "Alle Vorschläge sofort streichen", "Kombination erzeugt neue Möglichkeiten."], ["Wann bewertet ihr Ideen?", "Nach einer offenen Sammelphase", "Schon vor dem ersten Vorschlag", "Niemals", "Öffnen und Auswählen getrennt halten."], ["Welche Auswahl ist sinnvoll?", "Ideen nach Lernwirkung und Machbarkeit vergleichen", "Nur die teuerste wählen", "Nur die Idee der lautesten Person", "Kriterien machen Entscheidungen nachvollziehbar."], ["Eine Idee funktioniert im Test nicht. Was nun?", "Variieren oder eine andere Idee erproben", "Kreativität beenden", "Das Problem verheimlichen", "Kreativität und Testen gehören zusammen."]], "files": [], "seq": ["Ideen sammeln", "Ideen variieren und kombinieren", "Mit Kriterien auswählen", "Kleine Probe testen"]}, {"id": "team", "group": "Methoden", "title": "Gut im Team arbeiten", "icon": "🤝", "lead": "Gemeinsames Ziel, individuelle Verantwortung.", "cards": [["Absprachen", "Einigt euch auf Ziel, Rollen, Zeit und Aufgabenverantwortung."], ["Kommunikation", "Lasst alle ausreden, fragt nach und fasst Entscheidungen zusammen."], ["Konflikte", "Beschreibt Beobachtung, Wirkung und einen konkreten Wunsch; sucht gemeinsam Lösungen."], ["Verantwortung", "Helft bei Blockaden, überprüft Beiträge und verteilt Arbeit fair statt zwangsläufig identisch."]], "qs": [["Eine Person redet kaum mit. Was hilft?", "Gezielt nach ihrer Sicht fragen und Zeit geben", "Sie übergehen", "Ihr alle Restarbeiten geben", "Beteiligung braucht Raum."], ["Zwei Personen wollen verschiedene Formate. Was hilft?", "Gemeinsame Kriterien anwenden und beide Ideen prüfen", "Lautstärke entscheiden lassen", "Die Gruppe sofort auflösen", "Ein gemeinsames Ziel hilft bei Konflikten."], ["Welche Rückmeldung ist konstruktiv?", "Die Quellen fehlen noch; können wir sie heute ergänzen?", "Du bist immer faul", "Alles ist schlecht", "Beobachtung und konkreter Wunsch sind hilfreich."], ["Eine Aufgabe ist blockiert. Was macht ein Team?", "Hilfe organisieren und Aufgaben abstimmen", "Schuldigen suchen", "Die Karte heimlich löschen", "Gemeinsame Verantwortung bedeutet Unterstützung."], ["Wann ist Arbeit fair verteilt?", "Aufwand und Fähigkeiten werden gemeinsam berücksichtigt", "Alle bekommen genau gleich viele Karten", "Eine Person übernimmt grundsätzlich alles", "Anzahl der Karten sagt wenig über Aufwand."]], "files": [], "seq": null}, {"id": "plakat", "group": "Methoden", "title": "Plakat & Präsentation", "icon": "▣", "lead": "In wenigen Sekunden Orientierung schaffen.", "cards": [["Kernaussage", "Eine klare Botschaft und eine verständliche Überschrift zuerst."], ["Visuelle Hierarchie", "Große Titel, sinnvolle Zwischenüberschriften, kurze Texte, Weißraum und Kontrast."], ["Visualisieren", "Diagramme brauchen Einheiten, Legenden, verständliche Beschriftung und Quellen. Bilder müssen zur Aussage passen."], ["Test", "Aus Abstand lesen lassen: Was bleibt nach zehn Sekunden hängen? Quellen und Bildrechte prüfen."]], "qs": [["Was muss ein Plakat zuerst vermitteln?", "Die Kernaussage", "Jeden recherchierten Satz", "Alle Namen in größter Schrift", "Ein klarer Einstieg schafft Orientierung."], ["Ein Diagramm hat keine Achsenbeschriftung. Was fehlt?", "Einheiten und Bedeutung der Werte", "Mehr dekorative Bilder", "Eine längere Überschrift ohne Bezug", "Daten müssen interpretierbar sein."], ["Wie prüft ihr Lesbarkeit?", "Aus typischer Betrachtungsentfernung testen", "Nur am Laptop hineinzoomen", "Alles in Schriftgröße 8 setzen", "Das reale Nutzungsformat zählt."], ["Welches Bild passt?", "Ein Bild, das die Aussage erklärt und rechtmäßig nutzbar ist", "Ein beliebiges spektakuläres Bild", "Ein Bild ohne erkennbare Herkunft", "Visualisierungen dienen dem Verständnis."], ["Wie verbessert ihr ein textüberladenes Plakat?", "Kernaussagen kürzen und Zusammenhänge visualisieren", "Schrift noch kleiner machen", "Alle Quellen entfernen", "Reduktion verbessert Orientierung."]], "files": [], "seq": null}, {"id": "ki", "group": "Methoden", "title": "Recherche & KI · PADS", "icon": "⌘", "lead": "KI als Unterstützung, nicht als Ersatz für Denken.", "cards": [["P – Position", "Aus welcher Rolle soll die KI antworten?"], ["A – Aufgabe", "Was const materials={'einheit.pdf':'Projektübersicht · Entdeckertag, Qualifikation, Projektphase','prompts.docx':'Methodenblatt · Gute Prompts (PADS)','klima.pdf':'Skript · Klimawandel, Klimawende, Klimakommunikation','quiz.pdf':'Original-Klimawandel-Quiz','folien.pptx':'Original-Folien zum Skript (PowerPoint)','factsheet.pdf':'Leopoldina · Factsheet Klimawandel (2021, CC BY-ND 4.0)','sdg.pdf':'Skript · 17 Nachhaltigkeitsziele','tafel.png':'Tafelbild · Zusammenhänge Denkfehler und Denkwerkzeuge','denken.pdf':'Skript · Denkwerkzeuge für komplexe Probleme'};
const main=document.querySelector('#main'),live=document.querySelector('#live');let xp=0,done=new Set(),earned=new Set(),active=null,test=null,seqState=null,current='home';const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const mod=id=>modules.find(m=>m.id===id);function update(){ $('#points').textContent=xp+' XP';$('#rank').textContent=done.size>=12?'Klima-Profi':done.size>=6?'Vernetzungsprofi':done.size>=3?'Spurensucher:in':'Entdecker:in'}function gain(key,n){if(!earned.has(key)){earned.add(key);xp+=n;update();live.textContent='+'+n+' Erfahrungspunkte'}}function render(html,page){main.innerHTML=html;current=page;document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.nav===page)));main.focus();window.scrollTo(0,0)}function leave(fn){if(test&&!test.finished&&!confirm('Laufenden Test verlassen? Die bisherigen Punkte bleiben erhalten.'))return;test=null;fn()}function tile(m){return `<button class="tile" data-open="${m.id}"><span class="symbol" aria-hidden="true">${m.icon}</span><strong>${m.title}</strong><small>${m.lead}</small><span class="tag">${done.has(m.id)?'✓ Bestanden':m.qs.length+' Challenges'}</span></button>`}function home(){render(`<section class="hero"><div><div class="eyebrow">Verstehen · Vernetzen · Handeln</div><h2>Dein Wissen verändert, was du im Projekt erreichen kannst.</h2><p>Trainiere Fachwissen, Denkwerkzeuge und Projektmethoden. Wende sie anschließend gemeinsam an.</p><div class="stats"><div class="stat"><b>${done.size}/${modules.length}</b>Module bestanden</div><div class="stat"><b>${xp}</b>XP gesammelt</div></div><div class="meter" aria-label="Modulfortschritt"><i style="width:${100*done.size/modules.length}%"></i></div></div><div><p class="eyebrow">Interaktive Wissenslandkarte</p><div class="network"><button data-open="bias">Denkfehler</button><button data-open="plurv">Desinformation</button><button data-open="werk">Denkwerkzeuge</button><button data-open="sdg">SDGs</button><button class="core" data-open="netz">↓ Zusammenhänge entdecken ↓</button><button data-open="klima">Klimawandel</button><button data-open="wende">Klimawende</button></div><p class="muted" style="margin-top:8px">Denkwerkzeuge helfen, Fehler zu erkennen; SDGs geben Orientierung für die Klimawende.</p></div></section>${['Wissen','Denken','Methoden','Mission'].map((g,i)=>`<section class="section"><div class="eyebrow">Station ${i+1}</div><h2>${['Klima & Welt verstehen','Kritisch und vernetzt denken','Projekte erfolgreich machen','Transfermission'][i]}</h2><div class="grid">${modules.filter(m=>m.group===g).map(tile).join('')}</div></section>`).join('')}`,'home')}
function materialRow(k){return `<div class="material"><span>${esc(materials[k])}</span><div>${/\.(pdf|png)$/.test(k)?`<a href="material/${k}" target="_blank" rel="noopener">Anzeigen</a>`:''}<a href="material/${k}" download>Herunterladen</a></div></div>`}function lib(){render(`<div class="eyebrow">Originale der Unterrichtseinheit</div><h2>Materialbibliothek</h2><p class="muted">Die Materialien liegen lokal im Tool-Ordner. Jahreszahlen im Factsheet beziehen sich auf den Stand 2021. Die Energiedaten im Skript beziehen sich auf 2023.</p><div class="panel">${Object.keys(materials).map(materialRow).join('')}</div><details><summary>Tafelbild direkt ansehen</summary><div><img src="material/tafel.png" alt="Tafelbild: Denkfehler, Denkwerkzeuge, Desinformation und SDGs wirken auf Klimawandel und Klimawende" style="width:100%;height:auto"></div></details>`,'lib')}
const special={klima:`<div class="panel"><h3>Mini-Labor: Strahlungsbilanz</h3><svg class="diagram" viewBox="0 0 340 190" role="img" aria-label="Sonnenstrahlung zur Erde und Wärmestrahlung von der Erde ins All"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#ffd38b"/></marker><marker id="b" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#ff9c95"/></marker></defs><circle cx="42" cy="32" r="21" fill="#ffd38b"/><path d="M58 53L132 135" stroke="#ffd38b" stroke-width="5" marker-end="url(#a)"/><path d="M72 160Q170 95 268 160" fill="none" stroke="#91e5b5" stroke-width="21"/><path d="M66 113Q170 47 274 113" fill="none" stroke="#9edaff" stroke-width="12" opacity=".5"/><path d="M170 140L170 20" stroke="#ff9c95" stroke-width="4" marker-end="url(#b)"/><path id="returnRay" d="M210 87L210 137" stroke="#ff9c95" stroke-width="5" marker-end="url(#b)"/><text x="18" y="85" fill="#ffd38b" font-size="12">Sonne</text><text x="224" y="75" fill="#9edaff" font-size="11">Atmosphäre</text><text x="149" y="177" fill="#edf7f5" font-size="12">Erde</text></svg><label for="gh">Treibhausgas-Konzentration im Modell</label><input id="gh" type="range" min="0" max="2" value="1" step="1" style="width:100%"><p id="ghresult" aria-live="polite">Natürlicher Treibhauseffekt: Ein Teil der Wärmestrahlung wird absorbiert und zurückgestrahlt.</p><small class="muted">Qualitatives Modell, keine Temperaturprognose. Die Abstrahlung nach außen ändert sich zunächst; langfristig stellt sich eine neue Energiebilanz ein.</small></div>`,wende:`<div class="panel"><h3>Deutschland: erneuerbare Energien 2023</h3>${[['Strom','über 50 %',51],['Wärme','rund 20 %',20],['Verkehr','rund 7 %',7]].map(([a,b,c])=>`<div>${a} · ${b}</div><div class="meter"><i style="width:${c}%"></i></div>`).join('')}<small class="muted">Gerundete historische Werte aus eurem Skript. Balken für Strom nur schematisch. Keine aktuellen Daten.</small></div>`,plakat:`<div class="panel"><h3>Gestaltungsduell</h3><p>Welche Fassung lässt sich aus zwei Metern Entfernung schneller verstehen?</p><div class="poster"><div class="mock bad"><b>KLIMAWANDEL UND SCHULHOF UND BÄUME UND VIELES MEHR</b><p>Bei unserem Projekt haben wir verschiedene Dinge über die Umwelt herausgefunden und außerdem viele Ideen gesammelt und mit mehreren Leuten gesprochen und es gab verschiedene Möglichkeiten und wir haben uns überlegt, wie man den Schulhof verändern könnte.</p></div><div class="mock good"><h3>Mehr Schatten. Mehr Leben.</h3><div class="stripe"></div><p>Entsiegeln → Bäume pflanzen → Hitze mindern</p><small>Projektidee · Wirkung muss überprüft werden</small></div></div><div class="row" style="margin-top:12px"><button data-duel="0">Fassung A</button><button data-duel="1">Fassung B</button></div><p id="duel" aria-live="polite"></p></div>`,sdg:`<div class="panel"><h3>Die 17 Ziele entdecken</h3><div class="grid">${['Keine Armut','Kein Hunger','Gesundheit','Bildung','Geschlechtergleichheit','Sauberes Wasser','Saubere Energie','Arbeit und Wachstum','Industrie und Innovation','Weniger Ungleichheiten','Nachhaltige Städte','Nachhaltiger Konsum','Klimaschutz','Leben unter Wasser','Leben an Land','Frieden und Institutionen','Partnerschaften'].map((s,i)=>`<button data-sdg="${i+1}"><strong>${i+1}</strong> · ${s}</button>`).join('')}</div><p id="sdgresult" aria-live="polite">Tippe ein Ziel an, um ein Projektbeispiel zu sehen.</p></div>`,netz:`<div class="panel"><h3>Euer vernetztes Tafelbild</h3><img src="material/tafel.png" style="width:100%;border-radius:12px" alt="Tafelbild zu den Zusammenhängen von Klimawandel, Klimawende, Denkfehlern, Denkwerkzeugen, Desinformation und SDGs"><p>Wähle einen Zusammenhang und erkläre ihn deinem Team anhand eines Beispiels.</p><div class="row"><button data-open="bias">Denkfehler</button><button data-open="plurv">Desinformation</button><button data-open="werk">Denkwerkzeuge</button><button data-open="sdg">SDGs</button></div></div>`,kanban:`<div class="panel"><h3>Interaktives Übungsboard</h3><p>Verschiebe die Karten mit den Pfeilen. Versuche mit höchstens zwei laufenden Aufgaben zu arbeiten.</p><div id="board"></div><div class="row"><button data-resetboard>Übungsboard zurücksetzen</button></div></div>`};
function openModule(id){active=mod(id);const m=active;seqState=m.seq?{left:shuffle(m.seq),picked:[]}:null;render(`<button data-nav="home">← Campus</button><div class="section"><div class="eyebrow">${m.group} · Lernmodul</div><h2>${m.icon} ${m.title}</h2><p>${m.lead}</p></div><details open><summary>▤ Wissenskarten · ${m.cards.length} Kernideen</summary><div>${m.cards.map(([a,b])=>`<div class="fact"><b>${esc(a)}</b>${esc(b)}</div>`).join('')}</div></details>${special[id]||''}${m.seq?'<div class="panel"><h3>Reihenfolge-Challenge</h3><p>Tippe die Schritte in sinnvoller Modellreihenfolge an.</p><div id="sequence"></div></div>':''}<div class="panel"><h3>Challenge: Wissen anwenden</h3><p>${m.qs.length} Fragen mit sofortiger Erklärung. Bestanden ab 80 %. Wiederholen ist jederzeit möglich.</p><button class="primary" data-start>Challenge starten →</button></div>${m.files.length?`<details><summary>Originalmaterialien & Vertiefung</summary><div>${m.files.map(materialRow).join('')}</div></details>`:'<p class="muted">Methodenmodul: ergänzend für die schulische Projektphase entwickelt.</p>'}`,'module');if(m.seq)drawSeq();if(id==='kanban')drawBoard();if(id==='klima')$('#gh').addEventListener('input',e=>{let v=+e.target.value;$('#returnRay').setAttribute('stroke-width',[0,5,10][v]);$('#ghresult').textContent=['Ohne Treibhausgase: weniger Gegenstrahlung; die Erde wäre deutlich kälter.','Natürlicher Treibhauseffekt: Ein Teil der Wärmestrahlung wird absorbiert und zurückgestrahlt.','Verstärkter Treibhauseffekt: mehr Absorption; die Erde erwärmt sich bis zu einer neuen Energiebilanz.'][v]})}
function drawSeq(){let s=seqState;$('#sequence').innerHTML=`<div class="seq">${s.picked.map((v,i)=>`<div class="fact">${i+1}. ${esc(v)}</div>`).join('')}${s.left.map((v,i)=>`<button data-seq="${i}">${esc(v)}</button>`).join('')}</div><p id="seqresult" aria-live="polite">${s.left.length?'Wähle den nächsten Schritt.':'Reihenfolge vollständig.'}</p><button data-seqreset>Neu versuchen</button>`;if(!s.left.length){let correct=s.picked.every((v,i)=>v===active.seq[i]);$('#seqresult').textContent=correct?'✓ Richtige Reihenfolge!':'Noch nicht ganz. Modelllösung: '+active.seq.join(' → ');if(correct)gain(active.id+'-seq',15)}}
function start(){const m=active;test={id:m.id,qs:shuffle(m.qs),i:0,score:0,answered:false,finished:false,history:[]};question()}
function question(){let t=test,q=t.qs[t.i];t.answered=false;t.options=shuffle(q.slice(1,-1));render(`<button data-open="${t.id}">← Lernmodul</button><div class="panel"><div class="eyebrow">${mod(t.id).title} · Challenge ${t.i+1}/${t.qs.length}</div><div class="meter"><i style="width:${100*t.i/t.qs.length}%"></i></div><h2>${esc(q[0])}</h2><div class="choices">${t.options.map((a,i)=>`<button data-answer="${i}">${esc(a)}</button>`).join('')}</div><div id="answerfeedback" aria-live="polite"></div><div id="next"></div></div>`,'test')}
function answer(i){let t=test;if(t.answered)return;t.answered=true;let q=t.qs[t.i],ok=t.options[i]===q[1];t.history.push({q:q[0],a:t.options[i],correct:q[1],why:q.at(-1),ok});if(ok){t.score++;gain(t.id+'-'+q[0],10)}document.querySelectorAll('[data-answer]').forEach((b,j)=>{b.disabled=true;if(t.options[j]===q[1])b.classList.add('right');else if(j===i)b.classList.add('wrong')});$('#answerfeedback').innerHTML=`<div class="feedback"><b>${ok?'✓ Richtig!':'Noch nicht richtig.'}</b><p>${esc(q.at(-1))}</p></div>`;$('#next').innerHTML='<button class="primary" data-next>'+ (t.i+1===t.qs.length?'Auswertung':'Weiter →')+'</button>';$('#next button').focus()}
function next(){let t=test;if(!t.answered)return;if(++t.i<t.qs.length){question();return}t.finished=true;let pass=t.score/t.qs.length>=.8;if(pass){done.add(t.id);gain(t.id+'-complete',25);update()}render(`<div class="panel"><div class="eyebrow">Challenge abgeschlossen</div><h2>${pass?'✦ Modul bestanden!':'Weiter üben lohnt sich.'}</h2><div class="stats"><div class="stat"><b>${t.score}/${t.qs.length}</b>Richtige Antworten</div><div class="stat"><b>${Math.round(100*t.score/t.qs.length)} %</b>Ergebnis</div></div><p>${pass?'Das Modul ist auf deinem Campus markiert.':'Ab 80 % erhältst du die Modul-Auszeichnung.'}</p><div class="row"><button class="primary" data-open="${t.id}">Zum Lernmodul</button><button data-nav="home">Campus</button></div></div><details open><summary>Antworten nachschlagen</summary><div>${t.history.map(h=>`<div class="fact"><b>${h.ok?'✓':'↻'} ${esc(h.q)}</b>Deine Antwort: ${esc(h.a)}<br>Richtig: ${esc(h.correct)}<br>${esc(h.why)}</div>`).join('')}</div></details>`,'test')}
let boardSeed=[{text:'Drei Quellen zum Thema Hitze prüfen',at:0},{text:'Spielregeln als Entwurf schreiben',at:1},{text:'Prototyp mit zwei Personen testen',at:0},{text:'Überarbeitete Grafik auf Fehler prüfen',at:2}],board=boardSeed.map(x=>({...x}));function drawBoard(){let el=$('#board');if(!el)return;let wip=board.filter(b=>b.at===1).length;el.innerHTML=`<p class="${wip>2?'tag':'muted'}">${wip}/2 Aufgaben in Arbeit · ${wip>2?'Engpass: erst eine Aufgabe abschließen.':'WIP-Limit im Blick.'}</p><div class="board">${['Offen','In Arbeit','Prüfen','Fertig'].map((s,i)=>`<div class="lane"><h3>${s}</h3>${board.map((b,j)=>b.at===i?`<div class="ticket">${esc(b.text)}<div class="row">${i>0?`<button aria-label="${esc(b.text)} zurück" data-move="${j},-1">←</button>`:''}${i<3?`<button aria-label="${esc(b.text)} weiter" data-move="${j},1">→</button>`:''}</div></div>`:'').join('')}</div>`).join('')}</div><p id="boardmsg" aria-live="polite">${board.every(b=>b.at===3)?'✓ Alle Karten abgeschlossen. Im echten Projekt zählt die tatsächliche Prüfung.':''}</p>`;if(board.every(b=>b.at===3))gain('board',15)}
let checks=new Set();const checklist=['Leitfrage und Zielgruppe festgelegt','Fachliche Quellen überprüft','Aufgaben und Verantwortliche sichtbar','Frühen Prototyp erstellt','Feedback von Testpersonen gesammelt','Produkt gezielt verbessert','Quellen, Bildrechte und Fakten geprüft','Präsentation erprobt'];function work(){render(`<div class="eyebrow">Projektphase · Arbeitswerkzeuge</div><h2>Deine Methodenwerkstatt</h2><p>Trainiere die Abläufe und nutze die Checkliste als Gesprächsgrundlage für euer Team.</p><div class="panel"><h3>Kanban-Sandbox</h3><div id="board"></div><button data-resetboard>Beispiel zurücksetzen</button></div><div class="panel"><h3>Projekt-Check · ${checks.size}/${checklist.length}</h3>${checklist.map((s,i)=>`<div style="padding:9px 0"><label><input type="checkbox" data-check="${i}" ${checks.has(i)?'checked':''} style="min-height:0;width:20px;height:20px;vertical-align:middle"> ${s}</label></div>`).join('')}<p class="muted">Selbsteinschätzung, keine automatische Bewertung. Nur für diese Sitzung.</p></div><div class="grid">${modules.filter(m=>m.group==='Methoden').map(tile).join('')}</div>`,'work');drawBoard()}
const sdgExamples=['Energiearmut untersuchen','Lebensmittelverschwendung reduzieren','Hitzeschutz für vulnerable Menschen','Lernspiel zum Klima entwickeln','Zugang zu Projektrollen fair gestalten','Regenwasser sammeln','Solarenergie am Schulgebäude untersuchen','Faire Arbeitsbedingungen in Lieferketten','Reparierbare Produkte entwickeln','Klimafolgen sozial gerecht abfedern','Schulhof entsiegeln','Tausch- oder Reparaturaktion','Emissionen vermeiden','Ozeanversauerung erklären','Blühflächen für Insekten','Sachlichen Dialog organisieren','Mit lokalen Partnern zusammenarbeiten'];
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav){leave(()=>({home,work,lib}[d.nav])());return}if(d.open){leave(()=>openModule(d.open));return}if('start'in d)start();if('answer'in d)answer(+d.answer);if('next'in d)next();if('seq'in d){let v=seqState.left.splice(+d.seq,1)[0];seqState.picked.push(v);drawSeq()}if('seqreset'in d){seqState={left:shuffle(active.seq),picked:[]};drawSeq()}if('move'in d){let [j,delta]=d.move.split(',').map(Number);board[j].at=Math.max(0,Math.min(3,board[j].at+delta));drawBoard()}if('resetboard'in d){board=boardSeed.map(x=>({...x}));drawBoard()}if('duel'in d){$('#duel').textContent=d.duel==='1'?'✓ B: klare Kernaussage, Hierarchie und verständliche Wirkungskette.':'A ist schwer erfassbar. Vergleiche die klare Kernaussage und Wirkungskette in B.';if(d.duel==='1')gain('duel',10)}if('sdg'in d)$('#sdgresult').textContent='Projektbeispiel: '+sdgExamples[+d.sdg-1]});document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){let i=+e.target.dataset.check;if(e.target.checked)checks.add(i);else checks.delete(i);e.target.closest('.panel').querySelector('h3').textContent='Projekt-Check · '+checks.size+'/'+checklist.length}});home();update();
</script></body></html>
