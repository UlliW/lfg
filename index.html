<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171633">
  <title>LFG-Tools</title>
  <link rel="stylesheet" href="style.css?v=11">
  <script src="tools.js?v=13" defer></script>
  <script src="index.js?v=11" defer></script>
  <link rel="stylesheet" href="rechtliches.css">
</head>
<body>
  <header class="masthead">
    <div class="container masthead-inner">
      <h1>LFG<span>-</span>Tools</h1>
      <div class="search" id="tool-search" role="search" hidden>
        <label for="query">Tools suchen</label>
        <input id="query" type="search" placeholder="z. B. Koordinaten" aria-controls="tools" autocomplete="off">
      </div>
    </div>
  </header>
  <main class="container">
    <p class="search-status" id="search-status" role="status"></p>
    <ul class="tools" id="tools" aria-label="Werkzeuge"></ul>
    <noscript><p>Aktiviere JavaScript, um die Werkzeuge anzuzeigen.</p></noscript>
<nav class="lfg-rechtliches" aria-label="Rechtliches">
  <a href="https://lfg-ma.de/impressum-b/">Impressum</a>
  <a href="https://lfg-ma.de/datenschutz/">Datenschutz</a>
</nav>
  </main>
</body>
</html>
